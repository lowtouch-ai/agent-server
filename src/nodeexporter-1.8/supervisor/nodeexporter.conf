[program:nodeexporter]
command                 = /opt/bitnami/node-exporter/bin/node_exporter --path.procfs=/host/proc --path.sysfs=/host/sys --collector.cpu.info --collector.processes --collector.network_route  --collector.filesystem --collector.mountstats --path.rootfs=/rootfs --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|run)($|/) 
autostart               = true
autorestart             = true
stdout_logfile  = /appz/log/%(program_name)s.log
stderr_logfile  = /appz/log/%(program_name)s.log

