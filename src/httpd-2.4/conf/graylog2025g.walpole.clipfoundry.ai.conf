<VirtualHost *:443>
    ServerName graylog2025g.walpole.clipfoundry.ai

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/graylog2025g.walpole.clipfoundry.ai/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/graylog2025g.walpole.clipfoundry.ai/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket proxying (Graylog UI)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://localhost:9000/$1 [P,L]

    # Normal HTTP proxy
    ProxyPass / http://localhost:9000/
    ProxyPassReverse / http://localhost:9000/

    ErrorLog /appz/log/graylog2025g-error.log
    CustomLog /appz/log/graylog2025g-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName graylog2025g.walpole.clipfoundry.ai
    Redirect permanent / https://graylog2025g.walpole.clipfoundry.ai/
</VirtualHost>

