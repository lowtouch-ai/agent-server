ENV+=' -e VAULT_ADDR=https://vault:8200'
ENV+=' -e VAULT_ROLE_ID='$VAULT_ROLE_ID
ENV+=' -e VAULT_SECRET_ID='$VAULT_SECRET_ID
ENV+=' -e VAULT_APPROLE='$VAULT_APPROLE
ENV+=' -e AUTH_EMAIL_ENABLE=0'
ENV+=' -e GRAYLOG_TRANSPORT_EMAIL_HOSTNAME=smtp'
ENV+=' -e GRAYLOG_TRANSPORT_EMAIL_PORT=587'
ENV+=' -e GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200'
ENV+=' -e GRAYLOG_ELASTICSEARCH_DISCOVERY_ENABLED=true'
ENV+=' -e GRAYLOG_TRANSPORT_EMAIL_USE_AUTH=true'
ENV+=' -e GRAYLOG_TRANSPORT_EMAIL_USE_TLS=false'
ENV+=' -e GRAYLOG_TRANSPORT_EMAIL_USE_SSL=false'
ENV+=' -e GRAYLOG_TRANSPORT_EMAIL_AUTH_USERNAME=test@example.com'
ENV+=' -e GRAYLOG_TRANSPORT_EMAIL_AUTH_PASSWORD='VAULT:GRAYLOG_TRANSPORT_EMAIL_AUTH_PASSWORD
ENV+=' -e GRAYLOG_TRANSPORT_EMAIL_FROM_EMAIL=test@example.com'
ENV+=' -e GRAYLOG_PASSWORD_SECRET='VAULT:GRAYLOG_PASSWORD_SECRET
ENV+=' -e GRAYLOG_ROOT_PASSWORD_SHA2='VAULT:GRAYLOG_ROOT_PASSWORD_SHA2
#ENV+=' -e NODE_MODE=multi-node'   #default is single-node
ENV+=' -e RETENTION_ENABLE=1'   #default is 0
ENV+=' -e ELASTICSEARCH_INDEX_TIME=PT1H'
ENV+=' -e ELASTICSEARCH_TOTAL_INDICES=1095'
ENV+=' -e ELASTICSEARCH_NUMBEROF_REPLICAS=0'
#ENV+=' -e CLUSTER_MODE=1' #default is 0
ENV+=' -e GRAYLOG_JOURNAL_MAX_SIZE=5gb' #default is 5gb
ENV+=' -e CLEAR_JOURNAL=1'
ENV+=' -e GRAYLOG_PROCESSBUFFER_PROCESSORS=4'
ENV+=' -e GRAYLOG_OUTPUTBUFFER_PROCESSORS=2'
ENV+=' -e OUTPUT_BATCH_SIZE=250'
ENV+=' -e JAVA_HEAP_SIZE=4g'
ENV+=' -e RING_SIZE=32768'
ENV+=' -e  GRAYLOG_PROMETHEUS_EXPORTER_ENABLED=true'
ENV+=' -e  GRAYLOG_PROMETHEUS_EXPORTER_BIND_ADDRESS=0.0.0.0:9833'
ENV+=' -e GRAYLOG_MONGODB_URI=mongodb://mongo:27017/graylog
#MinIo Setup
ENV+=' -e MINIO_HOSTNAME=minio_hostname'
ENV+=' -e MINIO_ACCESS_KEY='VAULT:MINIO_ACCESS_KEY
ENV+=' -e MINIO_SECRET_KEY='VAULT:MINIO_SECRET_KEY
ENV+=' -e MINIO_BACKUP_TIME=07'
ENV+=' -e MINIO_BACKUP_ENABLE=0'
