#source /root/init.conf

#Vault Integration
ENV+=' -e VAULT_ADDR=https://vault:8200' 
ENV+=' -e VAULT_SKIP_VERIFY=true'
ENV+=' -e VAULT_ROLE_ID='$VAULT_ROLE_ID
ENV+=' -e VAULT_SECRET_ID='$VAULT_SECRET_ID
ENV+=' -e VAULT_APPROLE='$VAULT_APPROLE

#MinIo Setup
ENV+=' -e MINIO_ROOT_USER=minioadmin'
ENV+=' -e MINIO_ROOT_PASSWORD='VAULT:MINIO_ROOT_PASSWORD
ENV+=' -e MINIO_SECRET_KEY='VAULT:MINIO_SECRET_KEY
ENV+=' -e MINIO_BROWSER=on'
ENV+=' -e APPZ_LOG_HOST=graylog'
