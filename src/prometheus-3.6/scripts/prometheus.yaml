global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
- /etc/prometheus/rules.yaml

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
    - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
    - targets: ['redis:9121']

  - job_name: 'postgres_15'
    static_configs:
    - targets: ['postgres_master:9187']

  - job_name: 'postgres_13'
    static_configs:
    - targets: ['postgres_master:9187']

  - job_name: 'mariadb'
    static_configs:
    - targets: ['mariadb:9104']

  - job_name: 'mongo'
    static_configs:
    - targets: ['mongo:9216']

  - job_name: 'httpd'
    static_configs:
    - targets: ['httpd:9117']

  - job_name: 'airflow'
    static_configs:
    - targets: ['airflow:9102']

  - job_name: 'opensearch'
    metrics_path: '/_prometheus/metrics'
    static_configs:
    - targets: ['opensearch:9200']

  - job_name: 'graylog'
    static_configs:
    - targets: ['graylog:9833']

